<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A&amp;A Gadgets — Cart</title>
<link rel="icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/" class="brand">
      <img src="/images/logo.png" alt="A&A Gadgets logo">
    </a>
    <nav class="main-nav">
      <a href="/#featured">Featured</a>
      <a href="/#shop">Shop</a>
      <a href="/#about">About</a>
    </nav>
    <div class="header-actions">
      <a href="/cart.html" class="icon-btn" aria-label="Cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="21" r="1"/><circle cx="17" cy="21" r="1"/></svg>
        <span class="cart-count" id="cartCount" style="display:none">0</span>
      </a>
    </div>
  </div>
</header>

<main class="container cart-page">
  <div class="section-head">
    <div>
      <span class="eyebrow">Checkout</span>
      <h2>Your cart</h2>
    </div>
  </div>

  <div id="cartContent"></div>
</main>

<script src="/js/cart.js"></script>
<script>
  let productsById = {};
  let siteConfig = { stripeConfigured: false, currency: 'usd' };

  async function init() {
    const [productsRes, configRes] = await Promise.all([
      fetch('/api/products'),
      fetch('/api/config')
    ]);
    const products = await productsRes.json();
    siteConfig = await configRes.json();
    productsById = Object.fromEntries(products.map((p) => [p.id, p]));
    render();
  }

  function render() {
    const cart = getCart();
    const ids = Object.keys(cart);
    const container = document.getElementById('cartContent');

    if (ids.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          Your cart is empty.
          <div style="margin-top:20px;"><a href="/" class="btn">Browse gadgets</a></div>
        </div>`;
      return;
    }

    let subtotal = 0;
    const itemsHTML = ids.map((id) => {
      const product = productsById[id];
      if (!product) return '';
      const qty = cart[id];
      const lineTotal = product.price * qty;
      subtotal += lineTotal;
      return `
        <div class="cart-item">
          <img src="${product.image}" alt="${product.name}">
          <div>
            <div class="cart-item-name">${product.name}</div>
            <div class="cart-item-meta">${formatMoney(product.price, siteConfig.currency)} × ${qty} = ${formatMoney(lineTotal, siteConfig.currency)}</div>
            <div class="qty-control" style="margin-top:10px;display:inline-flex;">
              <button onclick="updateQty('${id}', ${qty - 1})">−</button>
              <span>${qty}</span>
              <button onclick="updateQty('${id}', ${qty + 1})">+</button>
            </div>
          </div>
          <button class="cart-item-remove" onclick="updateQty('${id}', 0)">Remove</button>
        </div>
      `;
    }).join('');

    container.innerHTML = `
      <div class="cart-layout">
        <div>${itemsHTML}</div>
        <div class="summary-box">
          <div class="summary-row"><span>Subtotal</span><span>${formatMoney(subtotal, siteConfig.currency)}</span></div>
          <div class="summary-row"><span>Shipping</span><span>Calculated at checkout</span></div>
          <div class="summary-row total"><span>Total</span><span>${formatMoney(subtotal, siteConfig.currency)}</span></div>
          <button class="btn btn-block" style="margin-top:20px;" id="checkoutBtn" onclick="checkout()">Checkout securely</button>
          ${!siteConfig.stripeConfigured ? '<div class="notice">Payments aren\'t connected yet. The store owner needs to add a Stripe key in <code>.env</code> before checkout can process real payments.</div>' : ''}
        </div>
      </div>
    `;
  }

  function updateQty(id, qty) {
    setQuantity(id, qty);
    render();
  }

  async function checkout() {
    const cart = getCart();
    const items = Object.entries(cart).map(([id, quantity]) => ({ id, quantity }));
    if (items.length === 0) return;

    const btn = document.getElementById('checkoutBtn');
    btn.disabled = true;
    btn.textContent = 'Redirecting to secure checkout…';

    try {
      const res = await fetch('/api/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items })
      });
      const data = await res.json();
      if (!res.ok) {
        showToast(data.error || 'Could not start checkout');
        btn.disabled = false;
        btn.textContent = 'Checkout securely';
        return;
      }
      window.location.href = data.url;
    } catch (err) {
      showToast('Network error — please try again');
      btn.disabled = false;
      btn.textContent = 'Checkout securely';
    }
  }

  init();
</script>
</body>
</html>
