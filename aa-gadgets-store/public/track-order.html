<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track your order — A&amp;A Gadgets</title>
<link rel="icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/style.css">
<style>
  .track-shell { max-width: 560px; margin: 0 auto; padding: 56px 0 100px; }
  .status-timeline { list-style: none; padding: 0; margin: 32px 0; }
  .status-timeline li {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 0; color: var(--muted); font-weight: 500; font-size: 14px;
  }
  .status-timeline li .dot {
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid var(--line); flex-shrink: 0;
  }
  .status-timeline li.done { color: var(--ink); }
  .status-timeline li.done .dot { background: var(--ink); border-color: var(--ink); }
  .status-timeline li.current { color: var(--ink); font-weight: 700; }
  .status-timeline li.current .dot { background: #fff; border-color: var(--ink); box-shadow: 0 0 0 3px var(--panel); }
</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/" class="brand">
      <img src="/images/logo.png" alt="A&A Gadgets logo">
    </a>
    <nav class="main-nav">
      <a href="/#featured">Featured</a>
      <a href="/#shop">Shop</a>
      <a href="/#about">About</a>
    </nav>
    <div class="header-actions">
      <a href="/cart.html" class="icon-btn" aria-label="Cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="21" r="1"/><circle cx="17" cy="21" r="1"/></svg>
        <span class="cart-count" id="cartCount" style="display:none">0</span>
      </a>
    </div>
  </div>
</header>

<main class="container track-shell">
  <span class="eyebrow">Order status</span>
  <h2 style="font-family:'Archivo',sans-serif; margin: 8px 0 24px;">Track your order</h2>

  <div class="card" id="lookupCard">
    <div class="field" style="margin-bottom:16px;">
      <label for="orderIdInput">Order ID</label>
      <input type="text" id="orderIdInput" placeholder="e.g. cod_a1b2c3d4">
    </div>
    <div class="field" style="margin-bottom:20px;">
      <label for="contactInput">Phone number or email used at checkout</label>
      <input type="text" id="contactInput" placeholder="Phone or email">
    </div>
    <button class="btn btn-block" id="lookupBtn" onclick="lookupOrder()">Check status</button>
    <p class="error-text" id="lookupError">Something went wrong.</p>
  </div>

  <div id="orderResult" style="display:none; margin-top:28px;"></div>
</main>

<script src="/js/cart.js"></script>
<script>
  const ORDER_STATUSES = ['Order Placed', 'Processing', 'Shipped', 'Out for Delivery', 'Delivered'];
  let siteConfig = { currency: 'php' };

  function escapeHTML(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  async function lookupOrder() {
    const orderId = document.getElementById('orderIdInput').value.trim();
    const contact = document.getElementById('contactInput').value.trim();
    const errorEl = document.getElementById('lookupError');
    const btn = document.getElementById('lookupBtn');
    errorEl.style.display = 'none';

    if (!orderId || !contact) {
      errorEl.textContent = 'Please enter both your order ID and the phone or email you used at checkout.';
      errorEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Checking…';

    try {
      const configRes = await fetch('/api/config');
      siteConfig = await configRes.json().catch(() => siteConfig);

      const res = await fetch('/api/track-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId, contact })
      });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.error || 'Could not find that order';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Check status';
        return;
      }
      renderOrder(data);
    } catch (e) {
      errorEl.textContent = 'Network error — please try again';
      errorEl.style.display = 'block';
    }
    btn.disabled = false;
    btn.textContent = 'Check status';
  }

  function renderOrder(order) {
    const resultEl = document.getElementById('orderResult');
    resultEl.style.display = 'block';

    if (order.fulfillmentStatus === 'Cancelled') {
      resultEl.innerHTML = `
        <div class="card">
          <h3 style="margin-top:0; color:var(--danger);">This order was cancelled</h3>
          <p style="color:var(--muted);">If you believe this is a mistake, please contact us with your order ID: <strong>${escapeHTML(order.id)}</strong></p>
        </div>`;
      return;
    }

    const currentIndex = ORDER_STATUSES.indexOf(order.fulfillmentStatus);
    const timelineHTML = ORDER_STATUSES.map((status, i) => {
      const cls = i < currentIndex ? 'done' : (i === currentIndex ? 'current' : '');
      return `<li class="${cls}"><span class="dot"></span> ${status}</li>`;
    }).join('');

    const itemsHTML = order.items.map((i) => {
      const variantText = i.variants && Object.keys(i.variants).length
        ? ` (${Object.entries(i.variants).map(([k, v]) => `${k}: ${v}`).join(', ')})`
        : '';
      return `<div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px;">
        <span>${escapeHTML(i.name)}${escapeHTML(variantText)} × ${i.quantity}</span>
        <span>${formatMoney(i.price * i.quantity, siteConfig.currency)}</span>
      </div>`;
    }).join('');

    resultEl.innerHTML = `
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;">
          <h3 style="margin:0;">Order ${escapeHTML(order.id)}</h3>
          <span style="font-weight:700;">${formatMoney(order.total, siteConfig.currency)}</span>
        </div>
        <p style="color:var(--muted); font-size:13px; margin-bottom:20px;">Placed ${new Date(order.createdAt).toLocaleString()} · ${order.paymentMethod === 'cod' ? 'Cash on Delivery' : 'Paid by card'}</p>
        <ul class="status-timeline">${timelineHTML}</ul>
        ${order.trackingNumber ? `<div class="notice" style="margin-bottom:20px;">Tracking number: <strong>${escapeHTML(order.trackingNumber)}</strong></div>` : ''}
        <h4 style="font-family:'Archivo',sans-serif; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-bottom:8px;">Items</h4>
        ${itemsHTML}
      </div>
    `;
  }

  // Pre-fill order ID if arriving from the confirmation page
  const params = new URLSearchParams(window.location.search);
  const prefillId = params.get('order_id');
  if (prefillId) document.getElementById('orderIdInput').value = prefillId;
</script>
</body>
</html>
