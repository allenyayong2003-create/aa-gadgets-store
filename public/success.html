<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order confirmed — A&amp;A Gadgets</title>
<link rel="icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/" class="brand">
      <img src="/images/logo.png" alt="A&A Gadgets logo">
    </a>
  </div>
</header>

<main class="container status-page" id="statusPage">
  <p style="color:var(--muted)">Confirming your order…</p>
</main>

<script src="/js/cart.js"></script>
<script>
  function formatDateShort(iso) {
    return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order_id') || params.get('session_id');
    const page = document.getElementById('statusPage');

    if (!orderId) {
      page.innerHTML = `
        <div class="icon-circle">✕</div>
        <h1>No order found</h1>
        <p>We couldn't find an order to confirm.</p>
        <a href="/" class="btn">Back to shop</a>`;
      return;
    }

    try {
      const [res, configRes] = await Promise.all([
        fetch(`/api/order-status/${orderId}`),
        fetch('/api/config')
      ]);
      const order = await res.json();
      const config = await configRes.json().catch(() => ({}));
      clearCart();

      const deliveryLine = (order.estimatedDeliveryMin && order.estimatedDeliveryMax)
        ? `<p style="color:var(--muted); font-size:14px; margin-top:-8px; margin-bottom:20px;">Estimated delivery: ${formatDateShort(order.estimatedDeliveryMin)} – ${formatDateShort(order.estimatedDeliveryMax)}</p>`
        : '';

      if (order.paymentMethod === 'cod') {
        page.innerHTML = `
          <div class="icon-circle">✓</div>
          <h1>Order placed — pay on delivery</h1>
          <p>Thanks${order.customer && order.customer.name ? ', ' + order.customer.name : ''}! Your order is confirmed. Please have ${formatMoney(order.total, config.currency || 'php')} ready in cash when it arrives.</p>
          ${deliveryLine}
          <div class="notice" style="margin-bottom:24px;">Your order ID is <strong>${order.id}</strong> — save this to track your order anytime.</div>
          <div style="display:flex; gap:12px;">
            <a href="/track-order.html?order_id=${order.id}" class="btn">Track this order</a>
            <a href="/" class="btn btn-outline">Continue shopping</a>
          </div>`;
      } else if (order.status === 'paid') {
        page.innerHTML = `
          <div class="icon-circle">✓</div>
          <h1>Thank you — order confirmed</h1>
          <p>Total charged: ${formatMoney(order.total, config.currency || 'php')}.</p>
          ${deliveryLine}
          <div class="notice" style="margin-bottom:24px;">Your order ID is <strong>${order.id}</strong> — save this to track your order anytime.</div>
          <div style="display:flex; gap:12px;">
            <a href="/track-order.html?order_id=${order.id}" class="btn">Track this order</a>
            <a href="/" class="btn btn-outline">Continue shopping</a>
          </div>`;
      } else {
        page.innerHTML = `
          <div class="icon-circle">…</div>
          <h1>Order received</h1>
          <p>Your order is being processed. If payment doesn't confirm shortly, please contact support.</p>
          <a href="/" class="btn">Continue shopping</a>`;
      }
    } catch (e) {
      page.innerHTML = `<p>Something went wrong confirming your order.</p><a href="/" class="btn">Back to shop</a>`;
    }
  }
  init();
</script>
</body>
</html>
