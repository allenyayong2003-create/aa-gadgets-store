<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A&amp;A Gadgets — Cart</title>
<link rel="icon" href="/images/logo.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/" class="brand">
      <img src="/images/logo.png" alt="A&A Gadgets logo">
    </a>
    <nav class="main-nav">
      <a href="/#featured">Featured</a>
      <a href="/#shop">Shop</a>
      <a href="/#about">About</a>
    </nav>
    <div class="header-actions">
      <a href="/cart.html" class="icon-btn" aria-label="Cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="21" r="1"/><circle cx="17" cy="21" r="1"/></svg>
        <span class="cart-count" id="cartCount" style="display:none">0</span>
      </a>
    </div>
  </div>
</header>

<main class="container cart-page">
  <div class="section-head">
    <div>
      <span class="eyebrow">Checkout</span>
      <h2>Your cart</h2>
    </div>
  </div>

  <div id="cartContent"></div>
</main>

<script src="/js/cart.js"></script>
<script>
  let productsById = {};
  let siteConfig = { onlinePaymentConfigured: false, currency: 'php', codEnabled: true };
  let paymentMethod = 'cod';
  let shippingMethods = [];
  let selectedShippingId = null;
  let appliedVoucher = null; // { code, discountAmount }
  let voucherError = '';

  async function init() {
    const [productsRes, configRes, shippingRes] = await Promise.all([
      fetch('/api/products'),
      fetch('/api/config'),
      fetch('/api/shipping-methods')
    ]);
    const products = await productsRes.json();
    siteConfig = await configRes.json();
    shippingMethods = await shippingRes.json().catch(() => []);
    productsById = Object.fromEntries(products.map((p) => [p.id, p]));
    paymentMethod = siteConfig.onlinePaymentConfigured ? 'card' : 'cod';
    if (shippingMethods.length > 0) selectedShippingId = shippingMethods[0].id;
    render();
  }

  function escapeHTML(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function variantLineText(variants) {
    if (!variants || Object.keys(variants).length === 0) return '';
    return Object.entries(variants).map(([k, v]) => `${k}: ${v}`).join(', ');
  }

  function currentShippingFee() {
    const method = shippingMethods.find((m) => m.id === selectedShippingId);
    return method ? method.fee : 0;
  }

  function render() {
    const cart = getCart();
    const lineKeys = Object.keys(cart);
    const container = document.getElementById('cartContent');

    if (lineKeys.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          Your cart is empty.
          <div style="margin-top:20px;"><a href="/" class="btn">Browse gadgets</a></div>
        </div>`;
      return;
    }

    let subtotal = 0;
    const itemsHTML = lineKeys.map((lineKey) => {
      const line = cart[lineKey];
      const product = productsById[line.productId];
      if (!product) return '';
      const qty = line.quantity;
      const lineTotal = product.price * qty;
      subtotal += lineTotal;
      const variantText = variantLineText(line.variants);
      return `
        <div class="cart-item">
          <img src="${product.image}" alt="${escapeHTML(product.name)}">
          <div>
            <div class="cart-item-name">${escapeHTML(product.name)}</div>
            ${variantText ? `<div class="cart-item-meta" style="margin-bottom:2px;">${escapeHTML(variantText)}</div>` : ''}
            <div class="cart-item-meta">${formatMoney(product.price, siteConfig.currency)} × ${qty} = ${formatMoney(lineTotal, siteConfig.currency)}</div>
            <div class="qty-control" style="margin-top:10px;display:inline-flex;">
              <button onclick="updateQty('${lineKey}', ${qty - 1})">−</button>
              <span>${qty}</span>
              <button onclick="updateQty('${lineKey}', ${qty + 1})">+</button>
            </div>
          </div>
          <button class="cart-item-remove" onclick="updateQty('${lineKey}', 0)">Remove</button>
        </div>
      `;
    }).join('');

    const shippingFee = currentShippingFee();
    const discountAmount = appliedVoucher ? appliedVoucher.discountAmount : 0;
    const total = Math.max(0, subtotal + shippingFee - discountAmount);

    const shippingHTML = shippingMethods.length > 0 ? `
      <div class="field" style="margin-bottom:16px;">
        <label>Shipping method</label>
        <select onchange="setShipping(this.value)" style="margin-top:6px;">
          ${shippingMethods.map((m) => `<option value="${m.id}" ${m.id === selectedShippingId ? 'selected' : ''}>${escapeHTML(m.name)} — ${formatMoney(m.fee, siteConfig.currency)} (${m.estimatedDaysMin}-${m.estimatedDaysMax} days)</option>`).join('')}
        </select>
      </div>
    ` : '';

    container.innerHTML = `
      <div class="cart-layout">
        <div>${itemsHTML}</div>
        <div class="summary-box">
          ${shippingHTML}

          <div class="field" style="margin-bottom:16px;">
            <label>Voucher code</label>
            <div style="display:flex; gap:8px; margin-top:6px;">
              <input type="text" id="voucherInput" placeholder="e.g. SAVE10" value="${appliedVoucher ? appliedVoucher.code : ''}" ${appliedVoucher ? 'disabled' : ''} style="flex:1;">
              ${appliedVoucher
                ? `<button type="button" class="btn btn-small btn-outline" onclick="removeVoucher()">Remove</button>`
                : `<button type="button" class="btn btn-small" onclick="applyVoucher()">Apply</button>`}
            </div>
            ${voucherError ? `<p class="error-text" style="display:block; margin-top:8px;">${escapeHTML(voucherError)}</p>` : ''}
            ${appliedVoucher ? `<p style="color:var(--ok); font-size:13px; margin-top:8px;">"${escapeHTML(appliedVoucher.code)}" applied — you saved ${formatMoney(discountAmount, siteConfig.currency)}</p>` : ''}
          </div>

          <div class="summary-row"><span>Subtotal</span><span>${formatMoney(subtotal, siteConfig.currency)}</span></div>
          <div class="summary-row"><span>Shipping</span><span>${formatMoney(shippingFee, siteConfig.currency)}</span></div>
          ${discountAmount > 0 ? `<div class="summary-row"><span>Discount</span><span>−${formatMoney(discountAmount, siteConfig.currency)}</span></div>` : ''}
          <div class="summary-row total"><span>Total</span><span>${formatMoney(total, siteConfig.currency)}</span></div>

          <div style="margin-top:24px;">
            <div class="field">
              <label>Payment method</label>
            </div>
            <div class="filters" style="margin-top:8px;">
              <button type="button" class="chip ${paymentMethod === 'cod' ? 'active' : ''}" onclick="setPaymentMethod('cod')">Cash on Delivery</button>
              <button type="button" class="chip ${paymentMethod === 'card' ? 'active' : ''}" onclick="setPaymentMethod('card')" ${!siteConfig.onlinePaymentConfigured ? 'disabled title="Online payment is not connected yet"' : ''}>Pay Online (Card/GCash/Maya)</button>
            </div>
          </div>

          <div id="codFields" style="margin-top:20px; ${paymentMethod === 'cod' ? '' : 'display:none;'}">
            <div class="field" style="margin-bottom:14px;">
              <label for="codName">Full name</label>
              <input type="text" id="codName" placeholder="Juan Dela Cruz">
            </div>
            <div class="field" style="margin-bottom:14px;">
              <label for="codPhone">Phone number</label>
              <input type="text" id="codPhone" placeholder="09XX XXX XXXX">
            </div>
            <div class="field" style="margin-bottom:14px;">
              <label for="codEmail">Email (optional — for order updates)</label>
              <input type="email" id="codEmail" placeholder="you@example.com">
            </div>
            <div class="field">
              <label for="codAddress">Delivery address</label>
              <textarea id="codAddress" placeholder="House/unit no., street, barangay, city, province"></textarea>
            </div>
          </div>

          <button class="btn btn-block" style="margin-top:20px;" id="checkoutBtn" onclick="checkout()">
            ${paymentMethod === 'cod' ? 'Place order (Cash on Delivery)' : 'Checkout securely'}
          </button>
          <p class="error-text" id="checkoutError">Something went wrong.</p>
          ${!siteConfig.onlinePaymentConfigured ? '<div class="notice">Online payment isn\'t connected yet, but Cash on Delivery is ready to use.</div>' : ''}
        </div>
      </div>
    `;
  }

  function setShipping(id) {
    selectedShippingId = id;
    render();
  }

  async function applyVoucher() {
    const code = document.getElementById('voucherInput').value.trim();
    voucherError = '';
    if (!code) return;

    const cart = getCart();
    let subtotal = 0;
    Object.values(cart).forEach((line) => {
      const product = productsById[line.productId];
      if (product) subtotal += product.price * line.quantity;
    });

    try {
      const res = await fetch('/api/vouchers/validate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, subtotal })
      });
      const data = await res.json();
      if (!res.ok) {
        voucherError = data.error || 'Could not apply voucher';
        appliedVoucher = null;
      } else {
        appliedVoucher = { code: data.code, discountAmount: data.discountAmount };
        voucherError = '';
      }
    } catch (e) {
      voucherError = 'Network error — please try again';
    }
    render();
  }

  function removeVoucher() {
    appliedVoucher = null;
    voucherError = '';
    render();
  }

  function setPaymentMethod(method) {
    if (method === 'card' && !siteConfig.onlinePaymentConfigured) return;
    paymentMethod = method;
    render();
  }

  function updateQty(lineKey, qty) {
    setQuantity(lineKey, qty);
    render();
  }

  async function checkout() {
    const cart = getCart();
    const lineKeys = Object.keys(cart);
    if (lineKeys.length === 0) return;
    const items = lineKeys.map((lineKey) => ({
      id: cart[lineKey].productId,
      quantity: cart[lineKey].quantity,
      variants: cart[lineKey].variants || {}
    }));

    const btn = document.getElementById('checkoutBtn');
    const errorEl = document.getElementById('checkoutError');
    errorEl.style.display = 'none';

    const commonFields = {
      shippingMethodId: selectedShippingId,
      voucherCode: appliedVoucher ? appliedVoucher.code : undefined
    };

    if (paymentMethod === 'cod') {
      const name = document.getElementById('codName').value.trim();
      const phone = document.getElementById('codPhone').value.trim();
      const email = document.getElementById('codEmail').value.trim();
      const address = document.getElementById('codAddress').value.trim();

      if (!name || !phone || !address) {
        errorEl.textContent = 'Please fill in your name, phone number, and delivery address.';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Placing your order…';

      try {
        const res = await fetch('/api/checkout/cod', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items, customer: { name, phone, address, email }, ...commonFields })
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || 'Could not place order';
          errorEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Place order (Cash on Delivery)';
          return;
        }
        window.location.href = `/success.html?order_id=${data.orderId}`;
      } catch (err) {
        errorEl.textContent = 'Network error — please try again';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Place order (Cash on Delivery)';
      }
      return;
    }

    // Online payment via PayMongo (card, GCash, Maya, GrabPay)
    btn.disabled = true;
    btn.textContent = 'Redirecting to secure checkout…';

    try {
      const res = await fetch('/api/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items, ...commonFields })
      });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.error || 'Could not start checkout';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Checkout securely';
        return;
      }
      window.location.href = data.url;
    } catch (err) {
      errorEl.textContent = 'Network error — please try again';
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Checkout securely';
    }
  }

  init();
</script>
</body>
</html>
